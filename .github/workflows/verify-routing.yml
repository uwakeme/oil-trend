name: verify-routing

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== 1) 直连 3002 看响应体（判断是不是我们的 Node 服务）==='
            curl -s --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1:3002/ | head -c 300
            echo ''
            echo '=== 2) 经 nginx 80 访问根路径的响应体 ==='
            curl -s --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1/ | head -c 300
            echo ''
            echo '=== 3) 经 nginx 访问 /health（Node 有的路由）==='
            curl -s -o /dev/null -w '  code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1/health || true
            echo '=== 4) 经 nginx 访问 /api/regions（业务路由）==='
            curl -s -o /dev/null -w '  code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1/api/regions || true
            echo '=== 5) 所以 404 到底是 nginx 的还是 Node 的？看响应体特征 ==='
            echo '  --- nginx 版 404（HTML）---'
            curl -s --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1/nonexistent-path-xyz | head -c 200
            echo ''
            echo '=== 6) ACME 校验目录现在有没有文件 ==='
            sudo ls -la /var/www/html/.well-known/acme-challenge/ 2>&1 | head
            echo '=== 7) 最近一次 certbot 失败后，nginx 配置是否被还原 ==='
            sudo grep -n 'acme-challenge' /etc/nginx/sites-enabled/oil-trend
            echo '=== 8) nginx access.log 最后 5 行（看命中哪个 server）==='
            sudo tail -5 /var/log/nginx/access.log 2>/dev/null || echo '无'