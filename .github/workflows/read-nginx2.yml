name: read-nginx2

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== conf.d 里所有文件 ==='
            sudo ls -la /etc/nginx/conf.d/
            echo '=== conf.d 里的 listen/server_name ==='
            sudo grep -rnE 'listen|server_name|default_server' /etc/nginx/conf.d/ 2>/dev/null
            echo '=== nginx 实际加载的 server 块总览 ==='
            sudo nginx -T 2>/dev/null | grep -nE '^# configuration file|listen|server_name' | head -60
            echo '=== 匹配测试：nginx -T 里 oil-trend 出现几次 ==='
            sudo nginx -T 2>/dev/null | grep -c 'oil-trend.uwakeme.top'
            echo '=== IPv6 是否监听 80 ==='
            sudo ss -tlnp | grep ':80 '