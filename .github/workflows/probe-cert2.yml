name: probe-cert2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== moyu 证书的 SAN（关键：看有没有 *.uwakeme.top）==='
            sudo openssl x509 -in /etc/letsencrypt/live/moyu.uwakeme.top/fullchain.pem -noout -subject -dates -ext subjectAltName 2>&1 | head -10
            echo '=== 所有 nginx 站点文件 ==='
            sudo ls -la /etc/nginx/conf.d/ 2>&1
            echo '=== 含 server_name 的完整配置片段 ==='
            sudo grep -rB2 -A12 'lyric-lab.uwakeme.top' /etc/nginx/ 2>/dev/null | head -40
            echo '=== certbot 已签发的证书列表 ==='
            sudo certbot certificates 2>&1 | head -25