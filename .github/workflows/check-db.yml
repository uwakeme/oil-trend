name: check-db

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== .env 的键名 ==='
            cut -d= -f1 /home/ubuntu/deploy/oil_trend/server/.env 2>/dev/null | grep -v '^$'
            echo '=== DATABASE_URL 指向哪个库（只看库名，不显示密码）==='
            grep '^DATABASE_URL=' /home/ubuntu/deploy/oil_trend/server/.env 2>/dev/null | sed 's#//[^@]*@#//***@#'
            echo '=== 服务器上有哪些数据库 ==='
            sudo -u postgres psql -tAc "SELECT datname FROM pg_database WHERE datistemplate = false;" 2>/dev/null || echo '读不到数据库列表'
            echo '=== oil_trend 库里的表与行数 ==='
            sudo -u postgres psql -d oil_trend -tAc "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname;" 2>&1 | head -15
            echo '=== server 里有没有 seed 脚本 ==='
            ls /home/ubuntu/deploy/oil_trend/server/scripts/ 2>/dev/null
            echo '=== 油势服务日志最后 10 行 ==='
            tail -10 /home/ubuntu/deploy/oil_trend/logs/oil-trend-out.log 2>/dev/null || pm2 logs oil-trend-server --lines 10 --nostream 2>/dev/null | tail -12