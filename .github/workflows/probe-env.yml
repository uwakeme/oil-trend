name: probe-env

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/var/www/oil-trend' }}"
            echo '=== .env 的键名（不显示值）==='
            if [ -f ${DEPLOY_DIR}/server/.env ]; then
              cut -d= -f1 ${DEPLOY_DIR}/server/.env | grep -v '^$'
            else
              echo '没有 .env'
            fi
            echo '=== 部署目录实际位置 ==='
            ls -la ${DEPLOY_DIR}/server/ | head -20
            echo '=== nginx 站点文件名 ==='
            sudo ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
            echo '=== 证书是泛域名吗 ==='
            for d in /etc/letsencrypt/live/*/; do
              echo "--- $d"
              sudo openssl x509 -in ${d}fullchain.pem -noout -subject -ext subjectAltName 2>/dev/null | head -5
            done