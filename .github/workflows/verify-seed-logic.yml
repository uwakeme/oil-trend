name: verify-seed-logic

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Verify on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/ubuntu/deploy/oil_trend/server
            echo '=== 库里现在有数据，need-seed 应返回 no ==='
            node scripts/need-seed.js
            echo '=== 直接查库确认 ==='
            node -e "require('./src/db').query('SELECT COUNT(*) n FROM oil_prices').then(r=>{console.log('oil_prices 行数:', r[0].n); process.exit(0)}).catch(e=>{console.log('查询失败:', e.message); process.exit(0)})"
            echo '=== seed 再跑一次是否幂等（行数应不变）==='
            node scripts/seed.js
            node -e "require('./src/db').query('SELECT COUNT(*) n FROM oil_prices').then(r=>{console.log('seed 后行数:', r[0].n); process.exit(0)})"