name: read-v6

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== 服务器自己的 IPv6 地址 ==='
            ip -6 addr show scope global | grep inet6 || true
            echo '=== IPv4 回环 + Host 头 ==='
            curl -s -o /dev/null -w '  127.0.0.1  code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1/ || true
            echo '=== IPv6 回环 + Host 头 ==='
            curl -s -o /dev/null -w '  [::1]      code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' 'http://[::1]/' || true
            echo '=== 走 IPv4 到公网 IP + Host 头 ==='
            curl -4 -s -o /dev/null -w '  ipv4:3002  code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://124.221.89.106/ || true
            echo '=== 走 IPv6 到自己的公网 IPv6 + Host 头 ==='
            V6=$(ip -6 addr show scope global | grep -oP 'inet6 \K[0-9a-f:]+' | head -1)
            echo "  用 IPv6: $V6"
            curl -s -o /dev/null -w '  ipv6       code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' "http://[$V6]/" || true
            echo '=== nginx 的 http 版本与 server_tokens ==='
            sudo nginx -V 2>&1 | tr ' ' '\n' | grep -E 'http_v2|ipv6' || true
            echo '=== 试 direct 到 3002（绕过 nginx，验证 Node 服务本身）==='
            curl -s -o /dev/null -w '  3002 code=%{http_code}\n' --max-time 5 http://127.0.0.1:3002/health || true