name: read-this-server

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== 这台机器的 nginx 站点 ==='
            sudo ls -la /etc/nginx/sites-enabled/
            echo '=== default 站点完整内容 ==='
            sudo cat /etc/nginx/sites-enabled/default
            echo '=== oil-trend 站点完整内容 ==='
            sudo cat /etc/nginx/sites-enabled/oil-trend
            echo '=== nginx -T 里 listen 80 的块 ==='
            sudo nginx -T 2>/dev/null | grep -nE 'configuration file|listen 80|listen \[::\]:80|server_name' | head -40
            echo '=== 各 Host 实测（这台机器，127.0.0.1）==='
            for hh in oil-trend.uwakeme.top lyric-lab.uwakeme.top; do
              printf '  %-30s ' "$hh"
              curl -s -o /dev/null -w 'code=%{http_code} redirect=%{redirect_url}\n' --max-time 5 -H "Host: $hh" http://127.0.0.1/ || true
            done
            echo '=== 油势 .env 的键名 ==='
            cut -d= -f1 /home/ubuntu/deploy/oil_trend/server/.env 2>/dev/null | grep -v '^$' || echo '读不到'