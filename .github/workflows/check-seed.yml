name: check-seed

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            D=/home/ubuntu/deploy/oil_trend
            echo '=== .env 键名 ==='
            cut -d= -f1 $D/server/.env 2>/dev/null | grep -v '^$'
            echo '=== 各表行数 ==='
            sudo -u postgres psql -d oil_trend -tAc "SELECT relname||'='||n_live_tup FROM pg_stat_user_tables ORDER BY relname;" 2>&1
            echo '=== server/scripts 里有哪些脚本 ==='
            ls $D/server/scripts/ 2>/dev/null
            echo '=== 手工跑一次 seed 看报什么（只写 seed 数据，可重复）==='
            cd $D/server && node -e "require('./src/services/collector').seed().then(r=>console.log('SEED_RESULT',JSON.stringify(r))).catch(e=>console.log('SEED_ERROR',e.message))" 2>&1 | tail -5
            echo '=== 跑完后的行数 ==='
            sudo -u postgres psql -d oil_trend -tAc "SELECT relname||'='||n_live_tup FROM pg_stat_user_tables WHERE relname IN ('oil_prices','oil_price_history','oil_adjust_events','oil_markets','oil_windows') ORDER BY relname;" 2>&1