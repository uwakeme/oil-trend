name: read-log

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== 先发一个带 oil-trend Host 的请求 ==='
            curl -s -o /dev/null -w '  code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1/ || true
            echo '=== 访问日志最后 5 行 ==='
            sudo tail -5 /var/log/nginx/access.log 2>/dev/null || echo '无 access.log'
            echo '=== access.log 里有没有 oil-trend 的记录 ==='
            sudo grep -c 'oil-trend' /var/log/nginx/access.log 2>/dev/null || echo 0
            echo '=== default 站点完整内容（关键）==='
            sudo cat -A /etc/nginx/sites-enabled/default | sed 's/\$$//' | head -50
            echo '=== oil-trend 站点文件是否与 sites-available 一致 ==='
            sudo diff /etc/nginx/sites-enabled/oil-trend /etc/nginx/sites-available/oil-trend && echo '一致' || echo '不一致'
            echo '=== 站点文件的权限/属主 ==='
            sudo ls -la /etc/nginx/sites-enabled/ /etc/nginx/sites-available/oil-trend