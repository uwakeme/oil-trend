name: probe-cert

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== letsencrypt 目录 ==='
            sudo ls -la /etc/letsencrypt/live/ 2>&1
            echo '=== 证书 SAN ==='
            for d in /etc/letsencrypt/live/*/; do
              echo "--- 目录: $d"
              sudo openssl x509 -in "${d}fullchain.pem" -noout -subject -dates -ext subjectAltName 2>&1 | head -10
            done
            echo '=== 已有 nginx 站点内容（lyric-lab）==='
            sudo cat /etc/nginx/sites-enabled/lyric-lab 2>/dev/null || echo '读不到 lyric-lab 站点文件'
            echo '=== openssl/certbot 是否可用 ==='
            which certbot openssl 2>&1