name: find-deploy-dir

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Read only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== pm2 里 oil-trend-server 的实际 cwd 与脚本路径 ==='
            pm2 describe oil-trend-server 2>/dev/null | grep -E 'exec cwd|script path|status' || true
            echo '=== /home/ubuntu 下有哪些部署目录 ==='
            ls -la /home/ubuntu/ | head -25
            echo '=== /home/ubuntu/deploy 下 ==='
            ls -la /home/ubuntu/deploy/ 2>/dev/null || echo '无'
            echo '=== 找 oil-trend 目录 ==='
            sudo find / -maxdepth 4 -type d -name 'oil-trend' 2>/dev/null | head -5
            echo '=== 油势的 .env 在哪 ==='
            sudo find / -maxdepth 5 -path '*oil-trend*/server/.env' 2>/dev/null | head -5
            echo '=== 油势 pm2 进程的工作目录内容 ==='
            CWD=$(pm2 describe oil-trend-server 2>/dev/null | grep 'exec cwd' | sed 's/.*│ //' | tr -d ' ')
            echo "  cwd=$CWD"
            ls -la "$CWD" 2>/dev/null | head -15
            echo '=== 本机带 Host 头访问 80（这台机器）==='
            curl -s -o /dev/null -w '  code=%{http_code}\n' --max-time 5 -H 'Host: oil-trend.uwakeme.top' http://127.0.0.1/ || true
            echo '=== 用公网 IP 访问（这台机器自己的 IP）==='
            curl -4 -s --max-time 8 https://api.ipify.org || echo ''
            echo ''