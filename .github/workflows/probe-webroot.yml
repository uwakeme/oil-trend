name: probe-webroot

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== nginx 站点里所有 root 指令 ==='
            sudo grep -rhn '^\s*root ' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | sort -u
            echo '=== 80 端口谁在占 ==='
            sudo ss -tlnp | grep ':80 ' || true
            echo '=== certbot 插件 ==='
            sudo certbot plugins 2>/dev/null | grep -E '^\*|nginx|webroot' | head -20
            echo '=== certbot renew 的 webroot 目录 ==='
            sudo cat /etc/letsencrypt/renewal/moyu.uwakeme.top.conf 2>/dev/null | grep -iE 'authenticator|webroot|installer' || echo '没有 renewal 配置'
            echo '=== 现有 .well-known 目录 ==='
            sudo ls -ld /var/www/html/.well-known 2>&1 || true