name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'data/reference-prices.js'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ⚠️ 必须声明 environment，Environment secrets 才会注入到 job 里。
    # 不写这一行的话，${{ secrets.SERVER_HOST }} 之类会展开成空字符串，
    # 表现为「ssh ... @ host」这种看着莫名其妙的用法错误。
    environment: 腾讯云

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 后端 =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # 装全量依赖：自检需要 pg-mem（devDependencies）
      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      # 部署前先跑自检：结构与 HTTP 契约不对就别部署了
      - name: Run backend self-test
        id: selftest
        working-directory: ./server
        run: npm test

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # 部署前先把线上正在跑的那份代码备份下来。
      # ⚠️ scp 是**覆盖**式上传：预检失败时旧进程虽然还活着，
      # 磁盘上已经是新版本 —— PM2 的 autorestart 一触发就加载坏版本。
      # 有备份才能在失败时真的退回去。
      - name: Backup current version on server
        id: backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            rm -rf ${DEPLOY_DIR}/server/.rollback
            mkdir -p ${DEPLOY_DIR}/server/.rollback
            cd ${DEPLOY_DIR}/server
            # 只备份会被覆盖的部分。node_modules 不备份：依赖很少变，
            # 备份它又慢又占磁盘。
            for item in src scripts package.json package-lock.json schema.sql oil-trend-pm2.json; do
              if [ -e "$item" ]; then cp -a "$item" ${DEPLOY_DIR}/server/.rollback/; fi
            done
            echo "已备份当前版本到 ${DEPLOY_DIR}/server/.rollback"

      - name: Copy backend to server
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/server ${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/logs ${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/data"
          # server/src server/scripts 是后端代码；
          # data/reference-prices.js 是价格交叉校验的基准（小程序包里不打进去，
          # 但服务端要用它核对抓到的价格对不对得上）
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./server/src ./server/scripts ./server/package.json ./server/package-lock.json ./server/schema.sql ./server/oil-trend-pm2.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/server/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} ./data/reference-prices.js ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/data/

      - name: Deploy to server via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH,DATABASE_URL
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"

            echo "确保日志目录存在..."
            mkdir -p ${DEPLOY_DIR}/logs

            echo "确保 .env 存在..."
            # 只在缺失时创建，绝不覆盖服务器上手动维护的 .env
            # 里面有 WX_APP_SECRET / OIL_TOKEN_SECRET / 模板 ID 等，绝不能被 CI 覆盖
            if [ ! -f "${DEPLOY_DIR}/server/.env" ]; then
              echo "DATABASE_URL=${DATABASE_URL}" > ${DEPLOY_DIR}/server/.env
              echo ">> 已创建初始 .env（仅含 DATABASE_URL）"
              echo ">> 请手动补充 WX_APP_ID / WX_APP_SECRET / OIL_SUBSCRIBE_TEMPLATE_ID"
            fi

            # ⚠️ 服务端启动时会强校验 OIL_TOKEN_SECRET（空密钥等于谁都能自签任意 openid）。
            # 缺这个变量的话新版本会直接拒绝启动 —— 那时候线上就是「旧进程已停、新进程没起」。
            # 所以在动进程之前先补上：只追加缺失的键，不碰用户已经维护的值。
            if ! grep -Eq '^[[:space:]]*OIL_TOKEN_SECRET=.{32,}' ${DEPLOY_DIR}/server/.env; then
              if grep -q '^[[:space:]]*OIL_TOKEN_SECRET=' ${DEPLOY_DIR}/server/.env; then
                # 键在但值无效（空值 / 短于 32 位）：把这一行换掉。
                # 这种值本来就过不了启动期校验，留着只会让部署卡死。
                sed -i "s|^[[:space:]]*OIL_TOKEN_SECRET=.*|OIL_TOKEN_SECRET=$(openssl rand -hex 32)|" ${DEPLOY_DIR}/server/.env
                echo ">> .env 里的 OIL_TOKEN_SECRET 无效（空值或短于 32 位），已重新生成"
              else
                # 键不存在：追加。⚠️ 追加前先确认文件末尾有换行 ——
                # 没有换行的话新密钥会粘到上一行后面，那一行既不是合法键
                # 也不是合法值，下次部署还会再追加一次。
                if [ -s ${DEPLOY_DIR}/server/.env ] && [ "$(tail -c 1 ${DEPLOY_DIR}/server/.env | wc -l)" -eq 0 ]; then
                  echo "" >> ${DEPLOY_DIR}/server/.env
                fi
                echo "OIL_TOKEN_SECRET=$(openssl rand -hex 32)" >> ${DEPLOY_DIR}/server/.env
                echo ">> .env 里缺 OIL_TOKEN_SECRET，自动生成一个"
              fi
            fi

            echo "安装生产依赖..."
            cd ${DEPLOY_DIR}/server
            npm install --omit=dev

            echo "应用数据库结构..."
            # 用项目自带的 pg 跑，不依赖服务器装 psql。
            # schema.sql 全是 CREATE TABLE IF NOT EXISTS / ADD COLUMN IF NOT EXISTS，重复执行安全。
            # ⚠️ 放在重启之前：结构出错要趁旧进程还在的时候失败，
            # 不然就变成「旧进程已删、新进程没起」了。
            node scripts/apply-schema.js

            echo "预检新版本的配置..."
            # 启动期强校验（config.validate()）在这里先跑一遍：
            # 配置不全就在旧进程还活着的时候退出，天然就是回滚。
            node -e "var c=require('./src/config');var r=c.validate();r.warnings.forEach(function(w){console.warn('⚠ '+w)});if(r.errors.length){console.error('配置不完整：');r.errors.forEach(function(e){console.error('  - '+e)});process.exit(1)}console.log('配置检查通过')"

            echo "跳过演示数据灌入..."
            # 生产库不灌演示数据。
            # 之前这里是「库空就自动灌」，结果每次部署都会把演示数据
            # 重新灌回去 —— 手动清理完，下一次部署又白清了。

            echo "重启 PM2 进程..."
            if [ ! -f "${DEPLOY_DIR}/server/oil-trend-pm2.json" ]; then
              echo "错误: 未找到 oil-trend-pm2.json"
              exit 1
            fi
            # 入口文件不在就早报错，并列出实际内容，别让 PM2 抛一句
            # 「Script not found」让人猜半天
            if [ ! -f "${DEPLOY_DIR}/server/src/index.js" ]; then
              echo "错误: 入口文件不存在 ${DEPLOY_DIR}/server/src/index.js"
              echo "实际目录内容："
              ls -la ${DEPLOY_DIR}/server/ || true
              echo "src 下："
              ls -la ${DEPLOY_DIR}/server/src/ || true
              exit 1
            fi
            # PM2 配置里的 cwd / 日志路径不能写死 —— 部署目录由 DEPLOY_DIR 决定，
            # 写死了就会去错的地方找脚本（报 Script not found）。
            # 这里按实际部署目录替换掉占位符。
            sed "s#__DEPLOY_DIR__#${DEPLOY_DIR}#g" \
              ${DEPLOY_DIR}/server/oil-trend-pm2.json > ${DEPLOY_DIR}/server/pm2.runtime.json
            # ⚠️ 原来这里是 `pm2 delete` 再 `pm2 start`：
            # 中间任何一步失败，线上就是「旧进程没了、新进程没起来」。
            # 改成 restart：进程条目一直在，PM2 自己管重启与日志。
            if pm2 describe oil-trend-server > /dev/null 2>&1; then
              pm2 restart oil-trend-server --update-env
            else
              pm2 start ${DEPLOY_DIR}/server/pm2.runtime.json
            fi
            pm2 save

            echo "部署完成"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 健康检查在服务器上跑：runner 上的 127.0.0.1 是 runner 自己，不是服务器。
      - name: Health check on server
        id: health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            # 对外域名从服务器上的 .env 读（OIL_API_BASE_URL），没配就退回本地端口
            PUBLIC_URL=$(grep -E '^OIL_API_BASE_URL=' ${DEPLOY_DIR}/server/.env 2>/dev/null | cut -d= -f2- | tr -d "'\"")

            # ⚠️ 原来固定 sleep 8 然后探 /health：
            # /health 只说明进程活着，数据库指错库它照样 200（假绿）；
            # 固定 8 秒在慢机器上也不够，快的机器上是白等。
            # 现在轮询 /ready —— 它会真的去连库、并检查配置。
            LOCAL_BASE="http://127.0.0.1:3002"
            echo "等待服务就绪（轮询 $LOCAL_BASE/ready）..."
            READY=0
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 5 "${LOCAL_BASE}/ready" || echo "000")
              if [ "$CODE" = "200" ]; then
                READY=1
                echo "✓ 服务已就绪（耗时约 $((i * 2)) 秒）"
                break
              fi
              sleep 2
            done
            if [ "$READY" != "1" ]; then
              echo "✗ 服务在 60 秒内没有就绪"
              echo "--- pm2 状态 ---"
              pm2 list || true
              echo "--- 最近日志 ---"
              pm2 logs oil-trend-server --lines 40 --nostream || true
              exit 1
            fi

            # 外网域名再探一次：nginx 反代或证书有问题也要看得见
            if [ -n "$PUBLIC_URL" ]; then
              echo "检查外网地址 $PUBLIC_URL ..."
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 "${PUBLIC_URL}/ready" || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "✓ 外网就绪检查通过 ($PUBLIC_URL)"
              else
                echo "✗ 外网就绪检查失败 (HTTP $CODE) —— $PUBLIC_URL"
                pm2 logs oil-trend-server --lines 40 --nostream || true
                exit 1
              fi
            else
              echo ">> .env 里没配 OIL_API_BASE_URL，跳过外网检查"
            fi

      # 任何一步失败都把线上退回到备份的那一版。
      # ⚠️ 以前健康检查超时只是 exit 1：磁盘上留着坏版本，
      # 进程一重启就加载坏版本 —— 「失败」等于把线上留着半残状态。
      - name: Roll back to previous version
        id: rollback
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            if [ ! -d "${DEPLOY_DIR}/server/.rollback/src" ]; then
              echo "没有可还原的备份，保持现状"
              exit 0
            fi
            echo "部署未通过，还原上一个版本..."
            cd ${DEPLOY_DIR}/server
            rm -rf src scripts
            cp -a ${DEPLOY_DIR}/server/.rollback/src ./src
            if [ -e ${DEPLOY_DIR}/server/.rollback/scripts ]; then
              cp -a ${DEPLOY_DIR}/server/.rollback/scripts ./scripts
            fi
            for item in package.json package-lock.json schema.sql oil-trend-pm2.json; do
              if [ -e "${DEPLOY_DIR}/server/.rollback/$item" ]; then
                cp -a "${DEPLOY_DIR}/server/.rollback/$item" ./ || true
              fi
            done
            pm2 restart oil-trend-server --update-env || true
            pm2 save || true
            sleep 3
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 5 "http://127.0.0.1:3002/ready" || echo "000")
            echo "还原后 /ready 返回 ${CODE}"
            rm -rf ${DEPLOY_DIR}/server/.rollback

      - name: Clean up SSH key
        if: always()
        run: rm -f /tmp/deploy_key

      - name: Summary
        if: always()
        run: |
          echo "## 部署结果"
          echo "- 后端自检: ${{ steps.selftest.outcome }}"
          echo "- 备份旧版本: ${{ steps.backup.outcome }}"
          echo "- 服务器部署: ${{ steps.deploy.outcome }}"
          echo "- 健康检查: ${{ steps.health.outcome }}"
          echo "- 失败回滚: ${{ steps.rollback.outcome }}"