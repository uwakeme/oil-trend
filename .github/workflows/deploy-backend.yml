name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ⚠️ 必须声明 environment，Environment secrets 才会注入到 job 里。
    # 不写这一行的话，${{ secrets.SERVER_HOST }} 之类会展开成空字符串，
    # 表现为「ssh ... @ host」这种看着莫名其妙的用法错误。
    environment: 腾讯云

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 后端 =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # 装全量依赖：自检需要 pg-mem（devDependencies）
      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      # 部署前先跑自检：结构与 HTTP 契约不对就别部署了
      - name: Run backend self-test
        working-directory: ./server
        run: npm test

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy backend to server
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/server ${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/logs"
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./server/src ./server/scripts ./server/package.json ./server/package-lock.json ./server/schema.sql ./server/oil-trend-pm2.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}/server/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH,DATABASE_URL
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"

            echo "确保日志目录存在..."
            mkdir -p ${DEPLOY_DIR}/logs

            echo "确保 .env 存在..."
            # 只在缺失时创建，绝不覆盖服务器上手动维护的 .env
            # 里面有 WX_APP_SECRET / OIL_TOKEN_SECRET / 模板 ID 等，绝不能被 CI 覆盖
            if [ ! -f "${DEPLOY_DIR}/server/.env" ]; then
              echo "DATABASE_URL=${DATABASE_URL}" > ${DEPLOY_DIR}/server/.env
              echo ">> 已创建初始 .env（仅含 DATABASE_URL）"
              echo ">> 请手动补充 WX_APP_ID / WX_APP_SECRET / OIL_SUBSCRIBE_TEMPLATE_ID / OIL_TOKEN_SECRET，否则登录与订阅消息不可用"
            fi

            echo "停止旧服务..."
            pm2 delete oil-trend-server 2>/dev/null || true

            echo "安装生产依赖..."
            cd ${DEPLOY_DIR}/server
            npm install --omit=dev

            echo "应用数据库结构..."
            # 用项目自带的 pg 跑，不依赖服务器装 psql。
            # schema.sql 全是 CREATE TABLE IF NOT EXISTS，重复执行安全。
            node scripts/apply-schema.js

            echo "检查是否需要灌演示数据..."
            # 表建好了但没数据时，接口能通、页面却是空的。
            # 只在当前价表为空时灌，不覆盖采集器写进来的真实数据。
            NEED_SEED=$(node -e "
              const db = require('./src/db');
              db.query('SELECT COUNT(*) AS n FROM oil_prices').then(r => {
                console.log(r[0].n === 0 ? 'yes' : 'no');
                process.exit(0);
              }).catch(() => { console.log('no'); process.exit(0); });
            ")
            if [ "$NEED_SEED" = "yes" ]; then
              echo "  数据库为空，灌入演示数据..."
              node scripts/seed.js
            else
              echo "  数据库已有数据，跳过（不覆盖真实数据）"
            fi

            echo "用 PM2 启动..."
            if [ ! -f "${DEPLOY_DIR}/server/oil-trend-pm2.json" ]; then
              echo "错误: 未找到 oil-trend-pm2.json"
              exit 1
            fi
            # 入口文件不在就早报错，并列出实际内容，别让 PM2 抛一句
            # 「Script not found」让人猜半天
            if [ ! -f "${DEPLOY_DIR}/server/src/index.js" ]; then
              echo "错误: 入口文件不存在 ${DEPLOY_DIR}/server/src/index.js"
              echo "实际目录内容："
              ls -la ${DEPLOY_DIR}/server/ || true
              echo "src 下："
              ls -la ${DEPLOY_DIR}/server/src/ || true
              exit 1
            fi
            # PM2 配置里的 cwd / 日志路径不能写死 —— 部署目录由 DEPLOY_DIR 决定，
            # 写死了就会去错的地方找脚本（报 Script not found）。
            # 这里按实际部署目录替换掉占位符。
            sed "s#__DEPLOY_DIR__#${DEPLOY_DIR}#g" \
              ${DEPLOY_DIR}/server/oil-trend-pm2.json > ${DEPLOY_DIR}/server/pm2.runtime.json
            pm2 start ${DEPLOY_DIR}/server/pm2.runtime.json
            pm2 save

            echo "部署完成"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 健康检查在服务器上跑：runner 上的 127.0.0.1 是 runner 自己，不是服务器。
      - name: Health check on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            echo "等待服务启动..."
            sleep 8
            # 对外域名从服务器上的 .env 读（OIL_API_BASE_URL），没配就退回本地端口
            PUBLIC_URL=$(grep -E '^OIL_API_BASE_URL=' ${DEPLOY_DIR}/server/.env 2>/dev/null | cut -d= -f2- | tr -d "'\"")
            if [ -z "$PUBLIC_URL" ]; then
              echo ">> .env 里没配 OIL_API_BASE_URL，改查服务器本地端口"
              BASE="http://127.0.0.1:3002"
            else
              BASE="$PUBLIC_URL"
            fi
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 \
              "$BASE/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ 健康检查通过 ($BASE)"
            else
              echo "✗ 健康检查失败 (HTTP $HTTP_CODE) —— $BASE"
              echo "--- pm2 状态 ---"
              pm2 list || true
              echo "--- 最近日志 ---"
              pm2 logs oil-trend-server --lines 30 --nostream || true
              exit 1
            fi

      - name: Summary
        if: always()
        run: |
          echo "## 部署结果"
          echo "- 后端自检: ${{ job.status }}"
          echo "- 服务器部署: ${{ job.status }}"