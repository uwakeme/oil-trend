name: Inspect DB (临时)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # 脚本必须传到服务器上才能跑 —— SSH 步骤是在服务器执行，不是 runner
      - name: Copy inspect script to server
        run: |
          DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./server/scripts ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${DEPLOY_DIR}/server/

      - name: Run inspect on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH,DATABASE_URL
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            cd ${DEPLOY_DIR}/server
            echo "--- 用服务器上的 .env 连库盘点 ---"
            set -a
            . ${DEPLOY_DIR}/server/.env
            set +a
            node ${DEPLOY_DIR}/server/scripts/inspect-db.js