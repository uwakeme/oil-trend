name: Inspect DB (临时)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload inspect script
        run: |
          mkdir -p /tmp/inspect
          cp -r server/scripts /tmp/inspect/
          cp -r server/src /tmp/inspect/
          cp server/package.json server/package-lock.json /tmp/inspect/

      - name: Run inspect on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH,DATABASE_URL
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            cd ${DEPLOY_DIR}/server
            npm install --omit=dev --silent 2>/dev/null || true
            echo "--- 用服务器上的 .env 连库盘点 ---"
            set -a
            . ${DEPLOY_DIR}/server/.env
            set +a
            node ${DEPLOY_DIR}/server/scripts/inspect-db.js