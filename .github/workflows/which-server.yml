name: which-server

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Identify server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo '=== 这台机器的公网 IPv4 ==='
            curl -4 -s --max-time 8 https://api.ipify.org || echo '取不到'
            echo ''
            echo '=== hostname ==='
            hostname
            echo '=== pm2 进程 ==='
            pm2 list 2>/dev/null | grep -E 'name|oil-trend|lyriclab|openmaic' || true
            echo '=== 3002 端口 ==='
            ss -tlnp 2>/dev/null | grep ':3002 ' || echo '3002 没在监听'
            echo '=== nginx 站点 ==='
            sudo ls /etc/nginx/sites-enabled/ 2>/dev/null
            echo '=== oil-trend 站点是否存在 ==='
            sudo cat /etc/nginx/sites-available/oil-trend 2>/dev/null | head -12 || echo '不存在'
            echo '=== 油势部署目录 ==='
            ls -d /var/www/oil-trend 2>/dev/null || echo '不存在'