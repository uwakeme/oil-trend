name: Clean Seed Data

on:
  workflow_dispatch:
    inputs:
      execute:
        description: '留空 = 只预览不删；填 confirm 才真删'
        required: false
        default: ''

jobs:
  clean:
    runs-on: ubuntu-latest
    environment: 腾讯云
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy scripts to server
        run: |
          DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./server/scripts ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${DEPLOY_DIR}/server/

      - name: Run clean on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH,DATABASE_URL
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            cd ${DEPLOY_DIR}/server
            set -a
            . ${DEPLOY_DIR}/server/.env
            set +a
            if [ "${{ inputs.execute }}" = "confirm" ]; then
              echo ">>> 确认删除模式"
              node scripts/clean-seed.js --execute
            else
              echo ">>> 预览模式（不删任何数据）"
              node scripts/clean-seed.js
            fi

      - name: Verify after clean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH,DATABASE_URL
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/deploy/oil_trend' }}"
            cd ${DEPLOY_DIR}/server
            set -a
            . ${DEPLOY_DIR}/server/.env
            set +a
            node scripts/inspect-db.js
            echo "--- 接口仍可访问吗 ---"
            curl -s --connect-timeout 5 --max-time 10 http://127.0.0.1:3002/health | head -c 200
            echo ""